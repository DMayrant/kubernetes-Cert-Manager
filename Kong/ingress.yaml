apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-kong
  namespace: nginx-system
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-lab
    cert-manager.io/common-name: nginx.example.test
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - nginx.example.test
      secretName: nginx-kong-tls
  rules:
    - host: nginx.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-deploy
                port:
                  number: 80
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-lab
spec:
  selfSigned: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-kong
  namespace: nginx-system
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-lab
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - nginx.example.test
      secretName: nginx-kong-tls
  rules:
    - host: nginx.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80